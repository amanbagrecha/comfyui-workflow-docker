# -------------------------------------------------------------------------
# PyTorch CUDA 12.8 index — used exclusively for torch/torchvision/torchaudio
# -------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
# opencv-contrib-python is the only OpenCV distribution.
# Marking opencv-python and opencv-python-headless with an impossible marker
# prevents uv from installing them when they appear as transitive deps
# (e.g. ultralytics pulls opencv-python). opencv-contrib-python is a superset
# and satisfies cv2 at runtime.
override-dependencies = [
    "opencv-python ; python_version < '0'",
    "opencv-python-headless ; python_version < '0'",
]
